<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pasiruosk</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 4rem auto;
      padding: 0 1.5rem;
      line-height: 1.7;
      color: #222;
    }
    a { color: #0a58ca; }
  </style>
<script data-goatcounter="https://arnasmat.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script>
    var t = setInterval(function() {
        if (window.goatcounter && window.goatcounter.visit_count) {
            clearInterval(t)
            window.goatcounter.visit_count({append: 'body', type: 'html'})
        }
    }, 100)
</script>
</head>
<body>
  <p>Labas, aš Arnas. Tu turbūt ieškai <a href="https://pasiruosk.lt">pasiruosk.lt</a>.</p>
  <p>
    Vilnius nusipirko <strong>pasiruosk.lt</strong>, o ne <strong>pasiruošk.lt</strong>.
    Galvojau būtų juokinga nusipirkt pasiruošk.lt.
  </p>
</body>
</html>
