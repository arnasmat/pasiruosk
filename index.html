<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pasiruošk</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      line-height: 1.7;
      color: #222;
    }
    a { color: #0a58ca; }
    h1 { font-size: 1.4rem; margin-top: 3rem; }
    hr { border: none; border-top: 1px solid #ddd; margin: 2.5rem 0; }
    #hud { display: flex; gap: 2rem; font-weight: 600; margin-bottom: 0.5rem; }
    #arena {
      position: relative;
      height: 420px;
      border: 2px solid #ccc;
      border-radius: 12px;
      overflow: hidden;
      background: #fafafa;
      touch-action: manipulation;
    }
    .item {
      position: absolute;
      font-size: 1rem;
      padding: 0.4rem 0.7rem;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
      transition: transform .08s;
    }
    .item:active { transform: scale(.92); }
    .item .em { font-size: 1.4rem; margin-right: .3rem; }
    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(255,255,255,.95);
      text-align: center; padding: 1rem;
    }
    #overlay h2 { margin: 0 0 .5rem; }
    button {
      font: inherit; padding: .5rem 1.2rem;
      border: 1px solid #0a58ca; border-radius: 8px;
      background: #0a58ca; color: #fff; cursor: pointer;
    }
    button:hover { background: #0846a3; }
    .pop {
      position: absolute;
      font-weight: 700;
      font-size: 1rem;
      pointer-events: none;
      animation: popup .8s forwards;
      z-index: 5;
      text-shadow: 0 1px 2px rgba(255,255,255,.9);
    }
    @keyframes popup {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-36px); }
    }
  </style>
<script data-goatcounter="https://arnasmat.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script>
    fetch('https://arnasmat.goatcounter.com/counter/' + encodeURIComponent(location.pathname) + '.json')
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (!d) return;
        const el = document.createElement('div');
        el.style.cssText = 'margin-top:3rem;font-size:.85rem;color:#888;';
        el.textContent = '👁 peržiūros: ' + d.count;
        document.body.appendChild(el);
      })
      .catch(() => {});
</script>
</head>
<body>
  <p>Tu turbūt ieškai <a href="https://pasiruosk.lt">pasiruosk.lt</a>.</p>
  <p>
    Vilnius nusipirko <strong>pasiruosk.lt</strong>, o ne <strong>pasiruošk.lt</strong>.
    Galvojau būtų juokinga nusipirkt pasiruošk.lt.
  </p>

  <hr>

  <p>Aš irgi turiu žaidimuką, tik ne tokį gerą.</p>
  <div id="hud">
    <span>⏱ <span id="time">45</span>s</span>
    <span>Taškai: <span id="score">0</span></span>
    <span>Rekordas: <span id="best">0</span></span>
  </div>
  <div id="arena">
    <div id="overlay">
      <h2>Pasiruošęs?</h2>
      <p>72 valandoms be pagalbos — ką imsi?</p>
      <button id="startBtn">Pradėti</button>
    </div>
  </div>

  <script>
  const GOOD = [
    ['💧','Vanduo'], ['🥫','Konservai'], ['🍱','Sausas davinys'],
    ['🔦','Žibintuvėlis'], ['🔋','Powerbank'], ['📻','Radijas (baterinis)'],
    ['⛑️','Pirmosios pagalbos rinkinys'], ['💊','Vaistai'], ['😷','Kaukė / respiratorius'],
    ['📄','Dokumentai'], ['💶','Grynieji pinigai'], ['🧥','Striukė'],
    ['🥾','Batai'], ['🧦','Kojinės'], ['🧤','Pirštinės'],
    ['🔪','Peilis / įrankis'], ['🔥','Žiebtuvėlis'], ['📣','Švilpukas'],
    ['🧻','Tualetinis popierius'], ['🪥','Higienos reikmenys']
  ];
  const BAD = [
    ['📺','Televizorius'], ['🧦','47 poros kojinių'], ['🪴','Kambarinis augalas'],
    ['🐠','Akvariumas'], ['♨️','Lygintuvas'], ['🛋️','Sofa'],
    ['🖨️','Spausdintuvas'], ['🧊','Šaldytuvas'], ['🎸','Gitara'],
    ['🎹','Pianinas'], ['💇','Plaukų džiovintuvas'], ['🍽️','Mikrobangų krosnelė'],
    ['💡','Liustra'], ['🪞','Stovimas veidrodis']
  ];
  const TIME = 45;
  const arena = document.getElementById('arena');
  const overlay = document.getElementById('overlay');
  const timeEl = document.getElementById('time');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  let score, timeLeft, running, spawnTimer, tickTimer, best = +localStorage.getItem('packup_best') || 0;
  bestEl.textContent = best;

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function freeSpot(el) {
    const w = arena.clientWidth, h = arena.clientHeight;
    const rects = [...arena.querySelectorAll('.item')].map(e => e.getBoundingClientRect());
    for (let i = 0; i < 15; i++) {
      const x = rand(8, w - 150), y = rand(8, h - 50);
      el.style.left = x + 'px'; el.style.top = y + 'px';
      const r = el.getBoundingClientRect();
      const hit = rects.some(o =>
        r.left < o.right + 6 && r.right + 6 > o.left &&
        r.top < o.bottom + 6 && r.bottom + 6 > o.top);
      if (!hit) return true;
    }
    return false;
  }

  function spawn() {
    if (!running) return;
    const isGood = Math.random() < 0.62;
    const pool = isGood ? GOOD : BAD;
    const [em, name] = pool[Math.floor(Math.random() * pool.length)];
    const el = document.createElement('div');
    el.className = 'item';
    el.style.visibility = 'hidden';
    el.innerHTML = '<span class="em">' + em + '</span>' + name;
    arena.appendChild(el);
    if (!freeSpot(el)) { el.remove(); spawnTimer = setTimeout(spawn, rand(350, 800)); return; }
    el.style.visibility = '';
    el.addEventListener('pointerdown', () => {
      if (!running) return;
      if (isGood) { score += 10; pop(el, '✓ ' + name + ' +10', '#198754'); }
      else { score -= 15; pop(el, '✗ ' + name + ' −15', '#dc3545'); }
      scoreEl.textContent = score;
      el.remove();
    });
    setTimeout(() => {
      if (running && isGood && el.isConnected) {
        score -= 5;
        scoreEl.textContent = score;
        pop(el, '…praleidai ' + name + ' −5', '#b45309');
      }
      el.remove();
    }, 2600);
    spawnTimer = setTimeout(spawn, rand(350, 800));
  }

  function pop(el, text, color) {
    const p = document.createElement('div');
    p.className = 'pop';
    p.textContent = text;
    p.style.color = color;
    p.style.left = el.style.left;
    p.style.top = el.style.top;
    arena.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }

  function start() {
    score = 0; timeLeft = TIME; running = true;
    scoreEl.textContent = 0; timeEl.textContent = timeLeft;
    overlay.style.display = 'none';
    arena.querySelectorAll('.item').forEach(e => e.remove());
    spawn();
    tickTimer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) end();
    }, 1000);
  }

  function end() {
    running = false;
    clearInterval(tickTimer);
    clearTimeout(spawnTimer);
    arena.querySelectorAll('.item').forEach(e => e.remove());
    if (score > best) { best = score; localStorage.setItem('packup_best', best); bestEl.textContent = best; }
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <h2>Laikas!</h2>
      <p>Taškai: <strong>${score}</strong></p>
      <p>Visas išvykimo krepšio sąrašas: <a href="https://lt72.lt/isvykimo-krepsys-5/">lt72.lt — Išvykimo krepšys</a></p>
      <p>O iš tikrųjų išbandyk savo žinias: <a href="https://pasiruosk.lt">pasiruosk.lt</a></p>
      <button id="againBtn">Dar kartą</button>`;
    document.getElementById('againBtn').addEventListener('click', () => { location.reload(); });
  }

  document.getElementById('startBtn').addEventListener('click', start);
  </script>

  <footer style="margin-top:3rem;padding-bottom:1rem;text-align:center;font-size:.9rem;color:#666;">
    🇺🇦 Slava Ukraini
  </footer>
</body>
</html>
